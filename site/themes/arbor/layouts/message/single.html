{{ with .Site.GetPage (print "/messages/" .Params.series)}}
  {{ partial "content-header.html" . }}
{{ end }}

<div class="message message-details col-sm-12 col-md-8 col-sm-offset-0 col-md-offset-2">
    {{ .Render "list" }}
    {{ with .Resources.GetMatch "transcription.md" }}
      <section class="message-transcription">
        <h3>Transcript</h3>
        {{ .Content }}
      </section>
    {{ end }}
</div>

{{ partial "content-footer.html" . }}
